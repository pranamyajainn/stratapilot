services:
  - type: web
    name: stratapilot
    env: docker
    plan: free # Free tier (Ephemeral filesystem - DB will reset on restart)

    region: oregon # or ohio, frankfurt, etc.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_executable_path
        value: /usr/bin/chromium
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: /data/insights.db
      # Add other secrets (GEMINI_API_KEY, etc.) in the Dashboard or syncGroup

